[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nephroscan-mlops"
version = "1.0.0"
description = "NephroScan MLOps: Production Deep Learning Platform for Kidney CT Scan Disease Classification."
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = "MIT"
authors = [
    { name = "AbQaadir", email = "qaadireng@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "pydantic>=2.5.0",
    "python-box>=6.0.2",
    "pyyaml>=6.0",
    "ensure==1.0.2",
    "pillow>=9.5.0",
    "numpy>=1.23.0,<2.0.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "tensorflow>=2.12.0,<2.16.0",
]
pytorch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
training = [
    "tensorflow>=2.12.0,<2.16.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "dvc>=3.0.0",
    "mlflow>=2.8.0",
    "dagshub>=0.3.0",
    "gdown>=4.7.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "seaborn>=0.12.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.5",
    "pre-commit>=3.5.0",
]
all = [
    "kidney-disease-classification[serving,training,dev]"
]

[tool.hatch.build.targets.wheel]
packages = ["src/KDC"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "artifacts",
    "logs",
    "research",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
