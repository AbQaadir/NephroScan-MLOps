services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: kdc-api:latest
    container_name: kdc-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kdc-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: kdc-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    networks:
      - kdc-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: kdc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    networks:
      - kdc-network

networks:
  kdc-network:
    driver: bridge

volumes:
  mlflow_data:
